volumes:
  mysql_data:
  var_data:
  etc_data:

networks:
  defaultnet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: freepbxint
    ipam:
      driver: default
      config:
        - subnet: 172.88.0.0/16
          gateway: 172.88.0.1

secrets:
  mysql_root_password:
    file: mysql_root_password.txt
  freepbxuser_password:
    file: freepbxuser_password.txt
  postfix_sasl_passwd:
    file: sasl_passwd.txt
  cloudflare_dns_token:
    file: cloudflare_dns_credentials.ini

services:
  db:
    restart: always
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_USER: freepbxuser
      MYSQL_PASSWORD_FILE: /run/secrets/freepbxuser_password
    secrets:
      - mysql_root_password
      - freepbxuser_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./my.cnf:/etc/mysql/my.cnf:ro
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - defaultnet
    ports:
      - "127.0.0.1:3306:3306"

  freepbx:
    restart: always
    image: escomputers/freepbx:17-nofail2ban
    # Wrap the image entrypoint with an idempotent init that re-applies the
    # host-networking port/postfix fixes on every boot (see config/freepbx-init.sh),
    # so they survive `docker compose down -v` instead of living only in etc_data.
    entrypoint: ["/usr/bin/env", "bash", "/usr/local/src/freepbx-init.sh"]
    command: ["/usr/bin/env", "bash", "/usr/local/src/entrypoint.sh"]
    # PBX_FQDN (from gitignored site.env) lets the init script point apache at the
    # Let's Encrypt cert for that FQDN once it exists. Optional so a fresh checkout
    # without site.env still boots (it falls back to the self-signed cert).
    env_file:
      - path: site.env
        required: false
    volumes:
      - var_data:/var
      - etc_data:/etc
      - ./config/freepbx-init.sh:/usr/local/src/freepbx-init.sh:ro
    network_mode: host
    secrets:
      - postfix_sasl_passwd
      - source: cloudflare_dns_token
        target: cloudflare_dns_token
        mode: 0400
    depends_on:
      - db
